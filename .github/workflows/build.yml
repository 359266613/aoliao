name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-14
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
#          - build_variant: rootful
#            package_scheme: ""
          - build_variant: rootless
            package_scheme: rootless
#          - build_variant: roothide
#            package_scheme: roothide

    steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        echo "$THEOS/bin" >> "$GITHUB_PATH"
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

    - name: Bump Package Version
      id: bump
      run: |
        VERSION_PREFIX="5.2.0"
        VERSION_BASE=0
        VERSION="${VERSION_PREFIX}-$((VERSION_BASE + ${{ github.run_number }}))"
        echo "Using version: $VERSION"
        sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
        echo "package_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Checkout Theos (RootHide)
      uses: actions/checkout@v4
      with:
        repository: roothide/theos
        path: theos-roothide
        submodules: recursive

    - name: Suppress vendored Theos/Orion build warnings
      run: |
        set -euo pipefail
        ORION_DIR="$THEOS/vendor/orion"
        # 给 Orion 所有 SwiftPM target 注入 -suppress-warnings，并移除 manifest 里的 #warning
        # （这些警告来自 theos 子模块 theos/Orion，不在本仓库内，只能在 CI 拉取后打补丁抑制）
        python3 - "$ORION_DIR" <<'PY' || true
        import os, re, sys
        FLAG = 'swiftSettings: [.unsafeFlags(["-suppress-warnings"])]'
        kinds = ('target', 'testTarget', 'executableTarget')

        def split_top(body):
            # 按顶层逗号切分参数（忽略括号/方括号/字符串内部的逗号）
            args = []
            cur = []
            depth = 0
            q = None
            i = 0
            n = len(body)
            while i < n:
                c = body[i]
                if q:
                    cur.append(c)
                    if c == q:
                        q = None
                    i += 1
                    continue
                if c == '"' or c == "'":
                    q = c
                    cur.append(c)
                elif c in '([{':
                    depth += 1
                    cur.append(c)
                elif c in ')]}':
                    depth -= 1
                    cur.append(c)
                elif c == ',' and depth == 0:
                    args.append(''.join(cur))
                    cur = []
                else:
                    cur.append(c)
                i += 1
            tail = ''.join(cur)
            if tail.strip():
                args.append(tail)
            return args

        def label_of(a):
            return a.strip().split(':', 1)[0].strip()

        def process(s):
            positions = []
            for kind in kinds:
                for m in re.finditer(r'\.' + re.escape(kind) + r'\(', s):
                    positions.append((m.start(), kind))
            positions.sort()
            out = []
            cursor = 0
            n = len(s)
            for start, kind in positions:
                if start < cursor:
                    continue
                paren = start + 1 + len(kind)
                depth = 0
                k = paren
                while k < n:
                    c = s[k]
                    if c == '(':
                        depth += 1
                    elif c == ')':
                        depth -= 1
                        if depth == 0:
                            break
                    k += 1
                body = s[paren + 1:k]
                if 'swiftSettings' in body:
                    continue
                args = split_top(body)
                labels = [label_of(a) for a in args]
                insert_at = len(args)
                for idx, lab in enumerate(labels):
                    # swiftSettings 必须位于 linkerSettings / plugins 之前
                    if lab in ('linkerSettings', 'plugins'):
                        insert_at = idx
                        break
                args.insert(insert_at, ' ' + FLAG)
                new_call = '.' + kind + '(' + ','.join(args) + ')'
                out.append(s[cursor:start])
                out.append(new_call)
                cursor = k + 1
            out.append(s[cursor:])
            return ''.join(out)

        for name in ("Package.swift", "Package@swift-5.6.swift"):
            p = os.path.join(sys.argv[1], name)
            if not os.path.isfile(p):
                continue
            s = open(p, encoding="utf-8").read()
            s2 = process(s)
            s2 = re.sub(r'#warning\(.*?\)', '', s2, flags=re.S)
            if s2 != s:
                open(p, "w", encoding="utf-8").write(s2)
                print("patched", name)
        PY
        # 用包装脚本让 `swift build` 额外带上 -Xswiftc -suppress-warnings，
        # 以抑制依赖包（swift-syntax / swift-argument-parser）的警告
        REAL_SWIFT="$(xcrun -f swift)"
        WRAP_DIR="$RUNNER_TEMP/swift-wrap"
        mkdir -p "$WRAP_DIR"
        cat > "$WRAP_DIR/swift" <<SWIFT
        #!/bin/sh
        REAL='$REAL_SWIFT'
        if [ "\$1" = "build" ]; then
          shift
          exec "\$REAL" build -Xswiftc -suppress-warnings "\$@"
        fi
        exec "\$REAL" "\$@"
        SWIFT
        chmod +x "$WRAP_DIR/swift"
        echo "$WRAP_DIR" >> "$GITHUB_PATH"

    - name: Install iOS SDK (iPhoneOS16.5)
      run: |
        set -euo pipefail
        mkdir -p "$THEOS/sdks"
        if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
          echo "iPhoneOS16.5.sdk already present"
          exit 0
        fi
        rm -rf /tmp/theos-sdks
        git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
        git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
        cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
        ls -1 "$THEOS/sdks"

    - name: Install Theos dependencies
      run: |
        # dpkg 提供 dpkg-deb，make package 生成 .deb 需要它
        brew install ldid dpkg xz
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Build Package
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos-roothide"
        SCHEME="${{ matrix.package_scheme }}"
        if [ -n "$SCHEME" ]; then
          export THEOS_PACKAGE_SCHEME="$SCHEME"
        fi
        make package
        echo "=== .deb files ==="
        find . -name "*.deb" -type f 2>/dev/null

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.build_variant }}
        path: |
          ./packages/*.deb
        if-no-files-found: error

    - name: Create Release
      if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        tag_name: v${{ steps.bump.outputs.package_version }}
        name: Stheno v${{ steps.bump.outputs.package_version }}
        files: |
          ./packages/*.deb
